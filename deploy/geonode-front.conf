# Rutas del portal nuevo dentro del Nginx de GeoNode (nginx4geonode).
# Va en /etc/nginx/sites-enabled/ junto a geonode.conf (mismo bloque server).
# Todo lo que NO matchee acá sigue yendo a GeoNode como hoy:
#   /api/v2, /geoserver, /catalogue (CSW + UI de gestión), /static, /uploaded, /account, /admin, /o …

# Resolución en tiempo de request: si el front está caído, nginx igual arranca.
set $ide_front http://front:80;

# Portada → front nuevo (location exacta: gana sobre "location /" de GeoNode)
location = / {
  proxy_pass $ide_front;
  proxy_set_header Host $host;
}

# Assets del front
location ^~ /portal-assets/ {
  proxy_pass $ide_front;
  proxy_set_header Host $host;
}

# Rutas del portal (en castellano: no chocan con GeoNode)
location ~ ^/(catalogo|capa|visor|geoservicios|servicios|metadatos|documentacion|organismos|institucional)(/.*)?$ {
  proxy_pass $ide_front;
  proxy_set_header Host $host;
}
